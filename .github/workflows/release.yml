# Publishes a signed release whenever new firmware lands in incoming/.
# Needs one repository secret: SIGNING_KEY = the full contents of parasha-signing-key.pem
#
# Test first: with a file incoming/PRERELEASE the release is published as a GitHub pre-release. Only displays
# set to the test channel install it; the others stay on "Latest", and the install page is not changed.
# To publish it to everyone, delete incoming/PRERELEASE: the same release becomes Latest and goes on the install page.
name: Publish release
on:
  push:
    branches: [main]
    paths: ["incoming/*.bin", "incoming/NOTES.md", "incoming/PRERELEASE"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: python3 tools/sign_release.py incoming out
      - name: Publish release (Latest) and update the install page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat out/VERSION)
          if [ -f incoming/PRERELEASE ]; then
            if gh release view "v$VER" > /dev/null 2>&1; then echo "v$VER is already published, nothing to do."; exit 0; fi
            NOTES=incoming/NOTES.md; [ -f "$NOTES" ] || { echo "Update to $VER" > /tmp/notes.md; NOTES=/tmp/notes.md; }
            gh release create "v$VER" out/manifest.json out/parasha-*.bin --title "v$VER (test)" --notes-file "$NOTES" --prerelease
            echo "Published v$VER as a pre-release (test channel only)"; exit 0
          fi
          if gh release view "v$VER" --json isPrerelease -q .isPrerelease 2>/dev/null | grep -q true; then
            gh release edit "v$VER" --prerelease=false --latest --title "v$VER"     # promote the tested pre-release
          elif gh release view "v$VER" > /dev/null 2>&1; then
            echo "v$VER is already published, nothing to do."; exit 0
          else
            NOTES=incoming/NOTES.md; [ -f "$NOTES" ] || { echo "Update to $VER" > /tmp/notes.md; NOTES=/tmp/notes.md; }
            gh release create "v$VER" out/manifest.json out/parasha-*.bin --title "v$VER" --notes-file "$NOTES" --latest
          fi
          for M in 42 75; do
            N=$([ $M = 75 ] && echo 7.5 || echo 4.2)
            [ -f "out/parasha-${N}in.bin" ] || continue
            cp "out/parasha-${N}in.bin" "docs/install/$M/parasha-${N}in.bin"
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" "docs/install/$M/manifest.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/install
          git diff --cached --quiet || { git commit -m "Install page: v$VER"; git push; }
          echo "Published v$VER"
